### ekf config file for new kybot (MID360s) ###
### 由旧车 robot_location2_ws/param/ekf_config.yaml 适配而来:
###   - IMU 改为 MID360s 内置 IMU /livox/imu (frame: livox_frame)
###   - 轮式里程计 /odom 来自 kybot_base (ros_arduino_python), child frame 已统一为 base_link
###   - TF odom->base_link 由本节点独占广播 (底盘 publish_tf: false)
ekf_filter_node:
    ros__parameters:
        frequency: 30.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        publish_tf: true
        publish_acceleration: false

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # -------------------------------------
        # 配置 1: 轮式里程计 (kybot_base 编码器)
        # -------------------------------------
        odom0: /odom
        odom0_config: [true,  true,  false,    # x, y 位置（由 vx/vyaw 积分得到，不漂）
                       false, false, true,     # yaw 朝向（运动学模型约束，不漂）
                       true,  false, false,    # vx 线速度
                       false, false, true,     # vyaw 角速度
                       false, false, false]
        # 说明：轮式里程计提供 x/y/yaw 绝对位姿，其误差有界，
        # 不会像 IMU 陀螺仪积分那样无界漂移。同时融合 vx/vyaw 速度。

        odom0_queue_size: 10
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: false

        # -------------------------------------
        # 配置 2: IMU (MID360s 内置, livox_ros_driver2 发布)
        # -------------------------------------
        imu0: /livox/imu
        # 注意: livox_frame 需要 base_link->livox_frame 静态 TF
        # (在 velodyne_localization.launch.py 中由 static_transform_publisher 发布)

        # IMU 配置矩阵:
        # x, y, z, roll, pitch, yaw,
        # vx, vy, vz, vroll, vpitch, vyaw,
        # ax, ay, az
        imu0_config: [false, false, false,
                      false, false, false,    # 去掉 yaw！陀螺仪积分朝向会漂，朝向由轮式里程计提供
                      false, false, false,
                      false, false, true,     # vyaw 角速度（陀螺仪直接测量，高频精准）
                      true,  false, false]    # ax 加速度
        # 说明：IMU 只融合 vyaw（高频角速度）和 ax（加速度），
        # yaw 朝向由轮式里程计运动学模型提供，不受陀螺仪 bias 漂移影响。

        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: false

        imu0_queue_size: 10
        imu0_remove_gravitational_acceleration: true

        # -------------------------------------
        # 协方差矩阵 (沿用旧车调好的值)
