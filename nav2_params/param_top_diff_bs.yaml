bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0                #控制器频率（Hz）
    # min_x_velocity_threshold: -0.35           #最小 x 速度阈值
    # min_y_velocity_threshold: 0.35             #最小 y 速度阈值
    # min_theta_velocity_threshold: 0.001       #最小速度阈值
    odom_topic: /odometry/filtered
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5            #所需运动半径
      movement_time_allowance: 10.0            #移动时间容差
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05 # 0.3                  #xy 目标容差
      yaw_goal_tolerance: 0.05 # 0.3                #yaw目标容差
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController" #RPP控制器，差速底盘标配，计算量极小
      desired_linear_vel: 0.25        #期望线速度（m/s），对应原vx_max
      lookahead_dist: 0.6             #前瞻距离（m）
      min_lookahead_dist: 0.3         #最小前瞻距离
      max_lookahead_dist: 0.9         #最大前瞻距离
      lookahead_time: 1.5             #前瞻时间，速度缩放前瞻距离用
      rotate_to_heading_angular_vel: 0.8  #原地转向角速度（rad/s）
      transform_tolerance: 0.1        #TF变换容差
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05  #接近目标时的最小线速度
      approach_velocity_scaling_dist: 0.6 #接近目标开始减速的距离
      use_collision_detection: true       #开启前向碰撞检测
      max_allowed_time_to_collision_up_to_carrot: 1.0  #允许的最短碰撞时间（秒）
      use_regulated_linear_velocity_scaling: true      #曲率限速：弯越急速度越慢
      regulated_linear_scaling_min_radius: 0.9         #开始限速的曲率半径
      regulated_linear_scaling_min_speed: 0.05         #限速后的最小速度
      use_cost_regulated_linear_velocity_scaling: true #按代价值限速：离障碍越近越慢
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      allow_reversing: true           #允许倒车，配合REEDS_SHEPP路径中的反向段
      use_rotate_to_heading: true     #用原地转向对准路径/目标朝向，发挥差速优势
      max_angular_accel: 2.0          #角加速度限制（rad/s^2）
      rotate_to_heading_min_angle: 0.785  #偏差超过此角度（约45°）先原地转向再走
#参数参考：https://docs.nav2.org/configuration/packages/configuring-regulated-pp.html

      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5  # 变换容差
      update_frequency: 10.0   #提高到10Hz，0.5m/s下每0.05m更新一次
      publish_frequency: 5.0  #与更新频率一致，MPPI读到的不再是过期数据
      global_frame: odom       #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False  #仿真时间
      rolling_window: true #成本地图是否应随机器人基座框架滚动
      width: 8             #代价地图的宽度（m）
      height: 8            #代价地图的高度（m）
      resolution: 0.05     #代价地图1像素的分辨率，以米为单位
      #robot_radius: 0.20   #机器人半径，如果未提供足迹坐标，则使用机器人半径。
      footprint: "[ [0.55, 0.37], [0.55, -0.37], [-0.55, -0.37], [-0.55, 0.37] ]"
      plugins: ["voxel_layer","inflation_layer"] #插件包括:{“体素层”，“障碍层”，“膨胀层”}
      inflation_layer:                             #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件。
        cost_scaling_factor: 5.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.50 #0.60暂时修改                     #从0.35改为0.40，必须≥内切半径0.38m
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"      #体素层插件。
        enabled: True
        publish_voxel_map: True
        origin_z: -0.25                             #体素地图的起始Z坐标，覆盖地面以下的负高度点
        z_resolution: 0.05                         #体素地图的Z轴分辨率
        z_voxels: 36                               #体素地图的Z轴体素数量，-0.25~1.55m
        max_obstacle_height: 2.0                   #可检测障碍物的最大高度（米）
        mark_threshold: 0                          #标记体素的阈值
        observation_sources: pointcloud            #观测源
        pointcloud:
          topic: /cloud_registered_base          #已用LIO自身位姿转到base_link的点云，消除odom同名异系导致的障碍漂移(P0-2)
          data_type: "PointCloud2"                 #数据类型，3D点云
          min_obstacle_height: -0.12               #base_link系下最小障碍高度，地面约-0.22，排除地面（与原2D切片一致）
          max_obstacle_height: 1.5                 #base_link系下最大障碍高度，过滤头顶/高处干扰
          clearing: True                            #是否启用障碍物清除功能
          marking: True                             #是否启用障碍物标记功能
          raytrace_max_range: 4.5                   #从10.0降到4.5，略大于obstacle_max_range避免误清除
          raytrace_min_range: 0.6                   #小于0.6m的点在机器人footprint内部，不参与清除
          obstacle_max_range: 4.0                   #提速后需要看得更远（5.6s×0.5m/s=2.8m，留余量3.5m）
          obstacle_min_range: 0.6                   #排除footprint内的自遮挡点云
          observation_persistence: 0.1              #观测数据保留1秒，超时未刷新的障碍物自动清除

      always_send_full_costmap: True                 #是否每次更新时都发送完整的成本图，而不是更新
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5  # 变换容差
      update_frequency: 1.0             #成本地图更新频率，从1.0降到0.5减少重规划触发
      publish_frequency: 1.0            #将成本图发布到话题的频率，从1.0降到0.5
      global_frame: map                 #全局框架
      robot_base_frame: base_link  #机器人底座框架
      use_sim_time: False               #仿真时间
      #robot_radius: 0.20                #机器人半径
      footprint: "[ [0.55, 0.37], [0.55, -0.37], [-0.55, -0.37], [-0.55, 0.37] ]"
      resolution: 0.05                  #全局地图1像素的分辨率，以米为单位
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] #插件包括：{“静态层”，“障碍层”，“膨胀层”}
      obstacle_layer:  #障碍层参数
        plugin: "nav2_costmap_2d::ObstacleLayer" #障碍层插件
        enabled: True
        observation_sources: pointcloud              #观测源
        pointcloud:
          topic: /cloud_registered_base                   #base_link系点云（经cloud_to_base_link转换）
          data_type: "PointCloud2"                   #数据类型，3D点云
          min_obstacle_height: -0.12                 #base_link系下最小障碍高度，排除地面
          max_obstacle_height: 1.5                   #base_link系下最大障碍高度
          clearing: True                             #是否启用障碍物清除功能
          marking: True                              #是否启用障碍物标记功能
          raytrace_max_range: 6.0                    #控制光线追踪从代价地图中清除障碍物的最大范围
          raytrace_min_range: 0.6                    #footprint内部的点不参与清除
          obstacle_max_range: 5.0                    #控制代价地图上标记障碍物的最大范围，从2.5降到1.5减少全局代价地图波动
          obstacle_min_range: 0.6                    #排除footprint内的自遮挡点云
      static_layer: #静态层参数
        plugin: "nav2_costmap_2d::StaticLayer"     #静态层插件
        map_subscribe_transient_local: True
      inflation_layer: #膨胀层参数
        plugin: "nav2_costmap_2d::InflationLayer"  #膨胀层插件
        cost_scaling_factor: 10.0                   #成本缩放因子，决定障碍物成本随距离的递减速度。
        inflation_radius: 0.60                     #从0.35改为0.40，必须≥内切半径0.38m
      always_send_full_costmap: True               #是否每次更新时都发送完整的成本图，而不是更新
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/kybot/kybot_ros2_ws/nav2_params/my_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0                #尝试保存地图的超时时间（秒）
    free_thresh_default: 0.25            #占用网格的自由空间最大概率阈值
    occupied_thresh_default: 0.65        #占用网格的占用空间最小概率阈值
    map_subscribe_transient_local: True  #地图话题的 QoS 设置

planner_server: #规划器服务器参数
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False
    expected_planner_frequency: 1.0     #预期的规划器频率。如果当前频率小于预期频率，则显示警告消息。
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" #Smac Hybrid-A* 规划器
      tolerance: 0.5                      # 如果无法达到精确的姿势，则规划的容差(单位m)
      downsample_costmap: false           # 是否将代价图下采样至另一个分辨率以进行搜索
      downsampling_factor: 1              # 对代价图进行下采样的乘数因子
      allow_unknown: false                # 允许在未知空间搜索
      max_iterations: 1000000             # 失败前搜索的最大迭代次数（以防无法到达），设置为 -1 以禁用
      max_on_approach_iterations: 1000    # 在公差范围内尝试达到目标的最大迭代次数，仅限 2D
      max_planning_time: 2.0              # 规划器进行规划、平滑和上采样的最大时间（以秒为单位）。从5.0降到2.0，目标不可达时快速放弃交给行为服务器
      motion_model_for_search: "REEDS_SHEPP"    # 2D Moore, Von Neumann; Hybrid Dubin, Redds-Shepp; State Lattice set internally
      cost_travel_multiplier: 3.5         #应用于搜索以避开高成本区域的成本乘数。
      # For 2D: Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      angle_quantization_bins: 32         #用于 SE2 搜索的角度箱数量。这可以是任何偶数，但好的基线是 64 或 72（以 5 度为增量）32
      # For Hybrid/Lattice nodes: Number of angle bins for search, must be 1 for 2D node (no angle search)
      analytic_expansion_ratio: 3.5       #规划器将尝试以与该值和最小启发式方法成比例的频率完成分析扩展。
      # For Hybrid/Lattice nodes: The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_cost: 200.0
      minimum_turning_radius: 0.25        #差速底盘可原地转向，转弯半径设小即可（0=不可用，给个小值让路径更自然）
      # For Hybrid/Lattice nodes: minimum turning radius in m of path / vehicle
      reverse_penalty: 1.2                #如果反向搜索，则对 SE2 节点应用启发式惩罚。
      # For Reeds-Shepp model: penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 #如果在搜索中改变方向（例如从左到右），则对 SE2 节点应用启发式惩罚。
      # For Hybrid nodes: penalty to apply if motion is changing directions, must be >= 0
      non_straight_penalty: 1.20          #如果在非直线方向上搜索，则对 SE2 节点应用启发式惩罚。
      # For Hybrid nodes: penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   #应用于 SE2 节点的姿势成本的启发式惩罚。
      # For Hybrid nodes: penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      lookup_table_size: 20.0               #距离窗口的缓存大小
      # For Hybrid nodes: Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false        #缓存障碍启发式，默认False环境如果是静态的（建好的地图），开 True 没问题，重规划会快很多。如果环境里有移动障碍物，改成 False。
      # For Hybrid nodes: Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.     
      smooth_path: true
      smoother:
        max_iterations: 1000 #平滑器平滑路径的最大迭代次数，以限制潜在的计算。
        w_smooth: 0.3 #应用于平滑数据点的平滑权重
        w_data: 0.2 #应用权重平滑以保留原始数据信息
        tolerance: 1.0e-10 #终止平滑会话的参数容差变化量
#参数参考：https://docs.nav2.org/configuration/packages/smac/configuring-smac-hybrid.html?highlight=nav2_smac_planner      
 
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10 #TF transform tolerance.
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw           #用于在局部代价地图上进行碰撞检查的原始代价地图主题。
    footprint_topic: local_costmap/published_footprint #局部代价地图框架中的足迹主题。
    cycle_frequency: 10.0 #运行行为插件的频率。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] #插件包括：{“旋转”、“备份”、“前进”、“等待”}
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1 #TF 变换容差
    use_sim_time: False
    simulate_ahead_time: 2.0 #提前模拟
    max_rotational_vel: 1.0  #最大旋转速度（弧度/秒），差速底盘可原地转向
    min_rotational_vel: 0.05 #最小旋转速度（弧度/秒）
    rotational_acc_lim: 1.0  #最大旋转加速度（rad/s^2）

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20 #循环速率
    stop_on_failure: false #如果单个航点失败，是否使操作任务失败。如果为 false，将继续到下一个航点。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 #机器人到达每个航点后休眠/等待的时间（以毫秒为单位）
#waypoint_follower 参数参考
#https://docs.nav2.org/configuration/packages/configuring-waypoint-follower.html?highlight=stop_on_failure
